[platformio]
default_envs = s3_hotspot

[env]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ILI9341 @ 1.6.3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISPLAY_ENABLED=1
    -DDISPLAY_TFT=1
    -DTFT_CS=14
    -DTFT_RST=21
    -DTFT_DC=47
    -DTFT_MOSI=45
    -DTFT_SCLK=3
    -DTFT_MISO=46
    -DTFT_SPI_HZ=20000000
    -DBLOCKLIST_PSRAM=1

; Preserves the original private Wi-Fi hotspot + IPv4 NAT.
[env:s3_hotspot]
framework = arduino, espidf
board_build.esp-idf.sdkconfig_path = sdkconfig.s3_hotspot
extra_scripts = pre:tools/hotspot_build.py
build_flags =
    ${env.build_flags}
    -DHOTSPOT_ENABLED=1

; DNS server on your existing LAN, without NAT/hotspot.
[env:s3_tft]
